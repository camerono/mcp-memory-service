language: pt-BR
version: 2

patterns:
  decision:
    - pattern: '\b(?:decidimos?|decidi|escolhemos?|optamos?|optei|vamos? (?:de|com|usar))\b'
      confidence: 0.7
    - pattern: '\b(?:decisão|abordagem|estratégia):\s'
      confidence: 0.7
    - pattern: '\b(?:vou usar|vamos usar|melhor usar|preferir?)\b.*\b(?:porque|pois|já que|em vez)\b'
      confidence: 0.7
    - pattern: '\b(?:ao invés de|em vez de|no lugar de)\b'
      confidence: 0.65
    - pattern: '\b(?:trade-?off|escolha|opção)\b.*\b(?:foi|é|será)\b'
      confidence: 0.65

  bug:
    - pattern: '\b(?:causa raiz|o bug era|o problema era|o erro era|a falha era)\b'
      confidence: 0.75
    - pattern: '\b(?:corrigido|corrigimos|fix foi|resolvido|a correção|consertado)\b'
      confidence: 0.7
    - pattern: '\b(?:quebrou|crashou|falhando|falhava|dava erro)\b.*\b(?:porque|por causa|devido)\b'
      confidence: 0.7
    - pattern: '\b(?:race condition|timeout|deadlock|connection refused|stack trace)\b'
      confidence: 0.7
    - pattern: '\b(?:o lance é que|o problema é que|acontece que)\b'
      confidence: 0.65

  convention:
    - pattern: '\b(?:regra|padrão|convenção|norma):\s'
      confidence: 0.8
    - pattern: '\b(?:sempre|nunca)\s+(?:usar|fazer|rodar|incluir|setar|checar|verificar)\b'
      confidence: 0.7
    - pattern: '\b(?:obrigatório|proibido|não pode|deve sempre|nunca deve)\b'
      confidence: 0.7
    - pattern: '\bNUNCA\b'
      confidence: 0.65
    - pattern: '\bSEMPRE\b'
      confidence: 0.65

  learning:
    - pattern: '\b(?:descobri|aprendi|percebi|entendi que|sacou que|na verdade)\b'
      confidence: 0.7
    - pattern: '\b(?:insight|lição|aprendizado|achado)\b'
      confidence: 0.7
    - pattern: '\b(?:não sabia|não fazia ideia|surpreso|inesperado)\b'
      confidence: 0.65
    - pattern: '\b(?:turns out|TIL|hoje aprendi)\b'
      confidence: 0.65

  context:
    - pattern: '\b(?:estado atual|situação|progresso|onde paramos|parei em)\b'
      confidence: 0.6
    - pattern: '\b(?:próximo|pendente|falta|bloqueado|aguardando|TODO)\b'
      confidence: 0.6
    - pattern: '\b(?:feito|concluído|pronto|implementado|resolvido)\b.*\b(?:agora|hoje|nesta sessão)\b'
      confidence: 0.6
    - pattern: '\b(?:em andamento|work in progress|WIP)\b'
      confidence: 0.6
    - pattern: '(?:^|\n)\*\*Status:\*\*\s*[✅❌⚠️🔄📌]'
      confidence: 0.7
    - pattern: '(?:^|\n)\- \[([ x])\]'
      confidence: 0.6
    - pattern: '\bPrioridade:\s*[🔴🟠🟢]'
      confidence: 0.65
    - pattern: '\b(?:Nada pendente|Nada urgente|HEARTBEAT_OK)\b'
      confidence: 0.5
    - pattern: '\bObjetivo cumprido\??\s*:?\s*(Sim|Não|Parcial)'
      confidence: 0.7

  tech_decision:
    - pattern: '(?:^|\n)\*\*Recomendo\b|\*\*Alternativa:\*\*|\*\*Solução:\*\*'
      confidence: 0.75
    - pattern: '\b(?:analisei as opções|comparei|alternativa mais rápida|melhor caminho)\b'
      confidence: 0.7
    - pattern: '\b(?:configurei|implementei|instalei|atualizei|trocando para|mudei para|adicionei)\b'
      confidence: 0.65

  summary:
    - pattern: '\b(?:Lições Curadas|Achados principais|Resumo Final|Documentos Criados)\b'
      confidence: 0.8
    - pattern: '\b(?:O que foi feito|Resultado|Veredito|Conclusão)\b\s*:'
      confidence: 0.7
    - pattern: '\b(?:O que aprendemos|O que mudou|O que ficou)\b'
      confidence: 0.7
    - pattern: '\b(?:Infra|Lições Aprendidas|Documentação)\b\s*[✅❌⚠️🔄]'
      confidence: 0.7

meta_keywords:
  - patternextractor
  - harvester
  - harvest pipeline
  - rewriter
  - bootstrap profile
  - consolidator
  - memory service
  - memory-service
  - extractor
  - autodream
  - autolearn
  - meta-filter
  - bootstrap_utils
  - threshold
  - prompt mais rigoroso
  - rodar harvest
  - pipeline de harvest
  - bootstrap vai melhorar

temporal_filters:
  - pattern: 'aguardando\s+(review|ação|resposta|merge)'
  - pattern: 'pendente[s]?\s+de\s+review'
  - pattern: 'PR[s]?\s*#\d+'
  - pattern: 'conta.*suspens[ao]'
  - pattern: 'email\s+(enviado|recebido|mandou)'

generic_filters:
  - pattern: '^é\s+(importante|necessário|fundamental|essencial)\s+'
